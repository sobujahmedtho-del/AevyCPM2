<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AevyCPM</title>
<meta name="description" content="AevyCPM is an open script library. Publish and download Lua, JavaScript and other scripts without an account.">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header class="site-header">
  <div class="container bar">
    <a class="brand" href="/" aria-label="AevyCPM home">
      <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M8 24 16 8l8 16M11.5 19h9" fill="none" stroke="var(--bg)" stroke-width="3" stroke-linejoin="round"/></svg>

      <a href="/" data-nav="home">Browse</a>

    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">

    <a href="/admin">Admin</a>

<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
